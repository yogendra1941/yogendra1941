<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">About Yogendra and interests</title><desc id="desc">Self-contained animated GitHub profile graphic for Yogendra Kumar.</desc>

<defs>
 <linearGradient id="blueRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <linearGradient id="cardLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8aa4c8" opacity=".14"/></pattern>
 <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
 <style><![CDATA[
 .text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
 @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
 @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
 @keyframes sweep{0%{transform:translateX(-520px);opacity:0}20%{opacity:.22}70%{opacity:.08}100%{transform:translateX(760px);opacity:0}}
 @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
 .entrance{animation:rise .8s ease-out both}.delay1{animation-delay:.18s}.delay2{animation-delay:.36s}.delay3{animation-delay:.54s}
 .pulse{animation:pulse 2.8s ease-in-out infinite}.sweep{animation:sweep 6s ease-in-out infinite}.nudge{animation:nudge 1.8s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){.entrance,.pulse,.sweep,.nudge{animation:none!important}}
 ]]></style>
</defs>
<rect width="100%" height="100%" rx="28" fill="#070b16"/><rect width="100%" height="100%" rx="28" fill="url(#dots)"/>
<rect x="28" y="28" width="1044" height="544" rx="24" fill="#0b1222" stroke="#263650"/><rect x="28" y="28" width="1044" height="4" rx="2" fill="url(#blueRed)"/>
<text class="mono" x="64" y="76" font-size="15" fill="#8ea5c5" letter-spacing="2">ABOUT / WHAT I LIKE</text><text class="text" x="64" y="126" font-size="34" font-weight="750" fill="#f4f7ff">Curious by default.</text><text class="text" x="64" y="160" font-size="18" fill="#9fb0ca">Learning through building, testing, and iteration.</text><rect x="64" y="208" width="480" height="62" rx="13" fill="#101b2e" stroke="#263b59"/><text class="mono" x="84" y="233" font-size="13" fill="#ff5368">01</text><text class="text" x="126" y="233" font-size="18" font-weight="700" fill="#eaf0fb">Web development</text><text class="text" x="126" y="254" font-size="13" fill="#9eafc8">Building useful, accessible web experiences.</text><rect x="64" y="287" width="480" height="62" rx="13" fill="#101b2e" stroke="#263b59"/><text class="mono" x="84" y="312" font-size="13" fill="#ff5368">02</text><text class="text" x="126" y="312" font-size="18" font-weight="700" fill="#eaf0fb">Software engineering</text><text class="text" x="126" y="333" font-size="13" fill="#9eafc8">Breaking ideas into maintainable pieces.</text><rect x="64" y="366" width="480" height="62" rx="13" fill="#101b2e" stroke="#263b59"/><text class="mono" x="84" y="391" font-size="13" fill="#ff5368">03</text><text class="text" x="126" y="391" font-size="18" font-weight="700" fill="#eaf0fb">Cybersecurity</text><text class="text" x="126" y="412" font-size="13" fill="#9eafc8">Thinking about safer software and systems.</text><rect x="64" y="445" width="480" height="62" rx="13" fill="#101b2e" stroke="#263b59"/><text class="mono" x="84" y="470" font-size="13" fill="#ff5368">04</text><text class="text" x="126" y="470" font-size="18" font-weight="700" fill="#eaf0fb">Learning by building</text><text class="text" x="126" y="491" font-size="13" fill="#9eafc8">Turning new concepts into working projects.</text>
<rect x="584" y="104" width="430" height="382" rx="22" fill="#101a2c" stroke="url(#cardLine)" stroke-width="1.5"/><text class="mono" x="618" y="146" font-size="14" fill="#8ea5c5" letter-spacing="1.5">OFF THE KEYBOARD</text>

<style><![CDATA[
@keyframes slide1 { 0%,31%{opacity:1} 34%,98%{opacity:0} 100%{opacity:1} }
@keyframes slide2 { 0%,32%{opacity:0} 35%,64%{opacity:1} 67%,100%{opacity:0} }
@keyframes slide3 { 0%,65%{opacity:0} 68%,97%{opacity:1} 100%{opacity:0} }
@keyframes progress { from{stroke-dashoffset:100} to{stroke-dashoffset:0} }
.slide1{animation:slide1 12s linear infinite}.slide2{animation:slide2 12s linear infinite}.slide3{animation:slide3 12s linear infinite}
.progress1{animation:progress 4s linear infinite}.progress2{animation:progress 4s linear infinite;animation-delay:4s}.progress3{animation:progress 4s linear infinite;animation-delay:8s}
@media(prefers-reduced-motion:reduce){.slide1,.slide2,.slide3,.progress1,.progress2,.progress3{animation:none!important}}
]]></style>
